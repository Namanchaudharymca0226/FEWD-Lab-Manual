<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interest Calculator</title>
</head>
<body>
  <h1>Simple Interest Calculator</h1>

  <form id="interest-form">
    <label for="principal">Principal:</label>
    <input type="number" id="principal" min="0" step="any" required>
    <br><br>

    <label for="rate">Rate (% per year):</label>
    <input type="number" id="rate" min="0" step="any" required>
    <br><br>

    <label for="time">Time (years):</label>
    <input type="number" id="time" min="0" step="any" required>
    <br><br>

    <button type="submit">Calculate Interest</button>
  </form>

  <p id="result" aria-live="polite"></p>

  <script type="module">
    const calculateInterest = (principal, rate, time) => {
      return (principal * rate * time) / 100;
    };

    const form = document.getElementById("interest-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const principal = Number(document.getElementById("principal").value);
      const rate = Number(document.getElementById("rate").value);
      const time = Number(document.getElementById("time").value);
      let interest = calculateInterest(principal, rate, time);

      result.textContent = `Simple Interest: ${interest.toFixed(2)}`;
    });
  </script>
</body>
</html>
