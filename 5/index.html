<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Changer</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      padding: 30px;
      background-color: white;
      border: 2px solid #cccccc;
      border-radius: 10px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      background-color: #333333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Color Changer</h1>
    <p>Current Color: <span id="color-name">White</span></p>
    <button id="change-button">Change Color</button>
  </div>

  <script>
    var colors = ["Lightblue", "Lightgreen", "Yellow", "Pink", "Orange", "Purple"];
    var colorIndex = -1;

    var button = document.getElementById("change-button");
    var colorName = document.getElementById("color-name");

    button.addEventListener("click", function () {
      colorIndex = colorIndex + 1;

      if (colorIndex >= colors.length) {
        colorIndex = 0;
      }

      document.body.style.backgroundColor = colors[colorIndex];
      colorName.textContent = colors[colorIndex];
    });
  </script>
</body>
</html>
