<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>
  <form id="registration-form">
    <h1>User Registration</h1>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name">
    <p id="name-error" class="error"></p>

    <label for="email">Email</label>
    <input type="text" id="email" placeholder="Enter your email">
    <p id="email-error" class="error"></p>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Minimum 8 characters">
    <p id="password-error" class="error"></p>

    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Re-enter password">
    <p id="confirm-error" class="error"></p>

    <button type="submit">Register</button>
    <p id="success-message" class="success"></p>
  </form>

  <script>
    var form = document.getElementById("registration-form");

    var nameInput = document.getElementById("name");
    var emailInput = document.getElementById("email");
    var passwordInput = document.getElementById("password");
    var confirmInput = document.getElementById("confirm-password");

    var nameError = document.getElementById("name-error");
    var emailError = document.getElementById("email-error");
    var passwordError = document.getElementById("password-error");
    var confirmError = document.getElementById("confirm-error");
    var successMessage = document.getElementById("success-message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      nameError.textContent = "";
      emailError.textContent = "";
      passwordError.textContent = "";
      confirmError.textContent = "";
      successMessage.textContent = "";

      var isValid = true;

      if (nameInput.value.trim() === "") {
        nameError.textContent = "Please enter your name.";
        isValid = false;
      }

      if (emailInput.value.trim() === "") {
        emailError.textContent = "Please enter your email.";
        isValid = false;
      } else if (!emailInput.value.includes("@") ||
                 !emailInput.value.includes(".")) {
        emailError.textContent = "Please enter a valid email.";
        isValid = false;
      }

      if (passwordInput.value === "") {
        passwordError.textContent = "Please enter a password.";
        isValid = false;
      } else if (passwordInput.value.length < 8) {
        passwordError.textContent = "Password must be at least 8 characters.";
        isValid = false;
      }

      if (confirmInput.value === "") {
        confirmError.textContent = "Please confirm your password.";
        isValid = false;
      } else if (confirmInput.value !== passwordInput.value) {
        confirmError.textContent = "Passwords do not match.";
        isValid = false;
      }

      if (isValid) {
        successMessage.textContent = "Registration successful!";
      }
    });
  </script>
</body>
</html>
