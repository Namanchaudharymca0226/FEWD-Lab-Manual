<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Navigation - Naman Chaudhary</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #222222;
    }

    header {
      background-color: white;
      padding: 15px 30px;
      border-bottom: 1px solid #dddddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    nav a {
      margin-left: 20px;
      color: #222222;
      text-decoration: none;
    }

    nav a:hover {
      color: #2a7a2e;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    section {
      padding: 40px 0;
      border-bottom: 1px solid #dddddd;
    }
  </style>
</head>
<body>
  <header>
    <h1>Naman Chaudhary</h1>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h2>Welcome</h2>
      <p>Hello! My name is Naman Chaudhary.</p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>I am learning web development.</p>
    </section>

    <section id="services">
      <h2>Services</h2>
      <p>I can create simple and clean websites.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: 2628mca0226@kiet.edu</p>
    </section>
  </main>
</body>
</html>
